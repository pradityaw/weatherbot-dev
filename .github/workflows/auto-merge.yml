name: Auto-merge cursor agent PRs

on:
  pull_request:
    branches:
      - feature/weatherbot-scaffolding
    types:
      - opened
      - synchronize
      - reopened

jobs:
  enable-auto-merge:
    name: Enable auto-merge for cursor branches
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'cursor/')
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch
